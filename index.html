<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Code Cottage</title>
  <script>
    // Languages currently published. Add 'af' here when translations return.
    const available = ['en'];
    const storedLang = localStorage.getItem('preferredLanguage');

    if (storedLang && available.includes(storedLang)) {
      window.location.href = `/${storedLang}/`;
    } else {
      const userLang = (navigator.language || navigator.userLanguage || 'en').slice(0, 2);
      const detectedLang = available.includes(userLang) ? userLang : 'en';

      localStorage.setItem('preferredLanguage', detectedLang);
      window.location.href = `/${detectedLang}/`;
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
